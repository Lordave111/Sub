name: FraudGuard checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/fraudguard-rebrand]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-only
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: build-placeholder-only
